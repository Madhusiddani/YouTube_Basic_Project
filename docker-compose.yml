version: "3.8"

services:
  backend:
    image: nehal524/youtube-backend:latest
    container_name: youtube-backend
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: always

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    restart: always