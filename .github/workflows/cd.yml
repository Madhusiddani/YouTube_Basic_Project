name: CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build Docker Image
      - name: Build Docker Image
        run: docker build -t madhusiddani/youtube-backend:latest .

      - name: Build Successful
        run: echo "Docker Image built successfully"

      # Login to Docker Hub
      - name: Docker Login
        run: echo "${{ secrets.YB_DOCKERHUB_PASS }}" | docker login -u "${{ secrets.YB_DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login Successful
        run: echo "Logged in to Docker Hub successfully"

      # Push Image
      - name: Push Docker Image
        run: docker push madhusiddani/youtube-backend:latest


  aws-deploy:
    needs: deploy
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      # Pull latest image
      - name: Pull latest docker image
        run: docker pull madhusiddani/youtube-backend:latest

      # Remove old container
      - name: Remove existing container
        run: docker rm -f yt-backend || true

      # Run Redis
      - name: Run Redis container
        run: docker run -d --name redis redis:latest

      # Run Backend Container
      - name: Run Backend Container
        run: docker run -d \
          --name yt-backend \
          --link redis:redis \
          -p 4000:4000 \
          -e MONGO_URI="${{ secrets.MONGODB_URI }}" \
          madhusiddani/youtube-backend:latest