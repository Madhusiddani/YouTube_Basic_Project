# workflow -> Pipeline
# workflow name
name: CD Pipeline

# event on which you want this pipeline to be triggered
on:
  push:
    branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]

# jobs
jobs:
    # job name
  deploy:

    # server
    runs-on: ubuntu-latest
    # versions you want to test your app on
    # strategy:
    #   matrix:
    #     node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
        # switch branch - (main)
    - uses: actions/checkout@v4
    # - name: Use Node.js ${{ matrix.node-version }}
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: ${{ matrix.node-version }}
    #     cache: 'npm'
    #     # actual command
    - name : Build Docker Image
      run: docker build -t nehal524/youtube-backend:latest .

    - name: "Build Successful"
      run: echo "Docker Image built successfully"
# docker hub - 2367te346tr3t2ewyquert7yer
    - name: Docker Login
      run: echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

    - name: Login Successful'
      run: echo "Logged in to Docker Hub successfully"

    - name: Push Docker Image
      run: docker push nehal524/youtube-backend:latest

  real-deploy:
    needs: deploy
    # server
    runs-on: self-hosted

    steps:
    - name : Pull Docker Image
      run: docker pull nehal524/youtube-backend:latest

# docker hub - 2367te346tr3t2ewyquert7yer
    - name: Delete old container
      run: docker rm -f youtube-backend

    # - name: Run Docker Container
    #   run: docker run -d -p 4000:4000 --name youtube-backend -e MONGO_URI=${{ secrets.MONGODB}} nehal524/youtube-backend:latest

    - name: Stop old containers
      run: docker compose down || true

    - name: Install Docker Compose
      run: |
       sudo curl -L "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
       sudo chmod +x /usr/local/bin/docker-compose

    - name: Start services with Docker Compose
      run: docker compose up -d
      env:
        MONGO_URI: ${{ secrets.MONGODB}}




  
